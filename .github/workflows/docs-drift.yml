name: product-content-sync

on:
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [product-docs-updated]
  workflow_dispatch:

concurrency:
  group: product-content-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oxdingzg/miao
          path: .product-sources/miao
      - uses: actions/checkout@v4
        with:
          repository: oxdingzg/mtty
          path: .product-sources/mtty
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Schema generation is TypeScript only; no native build/install hooks.
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .product-sources/miao
      - name: Refresh bilingual guides and shared shortcuts
        run: bun run sync:docs --miao .product-sources/miao --mtty .product-sources/mtty
      - name: Generate configuration and TUI schemas from the same checkout
        run: bun run sync:schemas --miao .product-sources/miao
      - run: bun run sync:models
      - run: bun run test
      - run: bun run check:content
      - run: bun run check:media
      - run: bun run check
      - run: bun run build
      - name: Open or update the product-content pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
          branch: chore/sync-product-content
          delete-branch: true
          commit-message: "docs: sync product guides and configuration schemas"
          title: "docs: sync product guides and configuration schemas"
          body: |
            Refreshes user guides, shared marketing shortcuts and configuration schemas from the product repositories.
            Content tests, content/media checks, Astro checks and the production build ran in this workflow.
            Unrelated source commits do not rewrite unchanged pages or their pinned provenance.
          add-paths: |
            src/content/docs
            src/data/mtty-shortcuts.json
            public/miao/config.json
            public/miao/tui.json
