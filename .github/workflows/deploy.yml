name: deploy

on:
  push:
    branches: [main]
  pull_request:
  # Refresh the model catalog daily: models.dev and the Command Code plan tiers
  # change without a site edit, and the catalog is generated at deploy time.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    # Validate PRs without deployment credentials. Push/dispatch publication
    # stays gated on the configured Cloudflare account.
    if: ${{ github.event_name == 'pull_request' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Attribution is the only place "opencode" belongs in hand-written code.
      # Every asset here is drawn from this repository's own source, so a hit
      # outside the notice means an upstream file was copied in. src/content/
      # is excluded on purpose: those pages are synced from the product
      # repositories and name opencode throughout, legitimately.
      - name: Guard against reused upstream assets
        run: |
          grep -rl opencode src/components src/pages src/layouts src/styles \
            | grep -v 'SiteFooter.astro' > /tmp/hits || true
          if [ -s /tmp/hits ]; then
            echo "::error::opencode appears outside the attribution notice:"
            cat /tmp/hits
            exit 1
          fi

      - run: bun run check:media

      - run: bun run check

      # The catalog miao fetches at runtime is generated, not committed, so it
      # is always current with models.dev and is present in the deployed assets.
      - run: bun run sync:models

      # Mirror the generated catalog and schema as assets on a rolling release,
      # so miao (and editors) have a fallback source if mtty.dev is unreachable.
      # The stable URLs are .../releases/download/models/api.json and
      # .../releases/download/models/model-schema.json.
      - name: Publish the catalog to a GitHub release (fallback)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create models --repo "${{ github.repository }}" \
              --title "Model catalog" \
              --notes "Rolling model catalog and model schema, refreshed by the deploy workflow."
          gh release upload models public/models/api.json public/miao/model-schema.json \
            --repo "${{ github.repository }}" --clobber

      - run: bun run build

      - uses: cloudflare/wrangler-action@v3
        if: github.event_name != 'pull_request'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
