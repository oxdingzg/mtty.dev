name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Gated on the Cloudflare account variable so that a repository without
    # credentials yet skips instead of failing on every push. Set
    # CLOUDFLARE_ACCOUNT_ID (variable) and CLOUDFLARE_API_TOKEN (secret) to arm it.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Attribution is the only place "opencode" belongs in hand-written code.
      # Every asset here is drawn from this repository's own source, so a hit
      # outside the notice means an upstream file was copied in. src/content/
      # is excluded on purpose: those pages are synced from the product
      # repositories and name opencode throughout, legitimately.
      - name: Guard against reused upstream assets
        run: |
          grep -rl opencode src/components src/pages src/layouts src/styles \
            | grep -v 'SiteFooter.astro' > /tmp/hits || true
          if [ -s /tmp/hits ]; then
            echo "::error::opencode appears outside the attribution notice:"
            cat /tmp/hits
            exit 1
          fi

      - run: bun run check

      - run: bun run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
